<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			(() => {
				try {
					const css = localStorage.getItem('theme-css');
					if (css) document.write('<style>' + css + '</style>');
					const m = localStorage.getItem('theme-mode');
					if (m && m !== 'system') document.documentElement.dataset.theme = m;
				} catch {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
